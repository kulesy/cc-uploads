name: TEMP - can GITHUB_TOKEN write a repo variable

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Try to create a repo Actions variable with GITHUB_TOKEN
        run: |
          echo "--- POST (create) ---"
          set +e
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/variables" \
            -f name=TMP_PERM_PROBE -f value=1 -i 2>&1 | head -20
          echo "exit=$?"
          echo "--- PATCH (update) ---"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/actions/variables/TMP_PERM_PROBE" \
            -f value=2 -i 2>&1 | head -20
          echo "exit=$?"
